# Trinetra bundled secret-format ruleset: well-known credential formats in any file.
# These match the provider's documented key shape, so they catch leaked keys in
# config, .env, notebooks, CI files, etc. regardless of the programming language.
# Positive/negative cases live in tests/semgrep_targets/secrets.txt.
rules:
  - id: trinetra.secrets.aws-access-key-id
    languages: [regex]
    severity: ERROR
    message: >-
      AWS access key ID found. If it is real, deactivate it in IAM now (removing
      it from the code is not enough: it stays in git history) and load keys
      from the environment or an IAM role.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
    pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b

  - id: trinetra.secrets.private-key
    languages: [regex]
    severity: ERROR
    message: >-
      A private key is committed to the source. Treat it as compromised: revoke
      and reissue it, and keep keys out of the repository.
    metadata:
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
    pattern-regex: -----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----

  - id: trinetra.secrets.github-token
    languages: [regex]
    severity: ERROR
    message: GitHub token found. Revoke it at github.com/settings/tokens and use a secret store.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{60,}\b

  - id: trinetra.secrets.slack-token
    languages: [regex]
    severity: ERROR
    message: Slack token found. Revoke it in the Slack app settings and use a secret store.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \bxox[baprs]-[0-9A-Za-z]{10,}-[0-9A-Za-z-]{10,}\b

  - id: trinetra.secrets.stripe-live-key
    languages: [regex]
    severity: ERROR
    message: Stripe live secret key found. Roll it in the Stripe dashboard and use a secret store.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \b(sk|rk)_live_[0-9A-Za-z]{24,}\b

  - id: trinetra.secrets.google-api-key
    languages: [regex]
    severity: WARNING
    message: >-
      Google API key found. Restrict or regenerate it in the Google Cloud
      console; browser keys must at least be referrer-restricted.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b

  - id: trinetra.secrets.llm-api-key
    languages: [regex]
    severity: ERROR
    message: >-
      LLM provider API key (Anthropic/OpenAI) found. Revoke it in the provider
      console and load it from the environment (.env is git-ignored).
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: \bsk-ant-(api|admin)\d{2}-[A-Za-z0-9_-]{80,}\b|\bsk-(proj-)?[A-Za-z0-9_-]{20}T3BlbkFJ[A-Za-z0-9_-]{20,}\b

  - id: trinetra.secrets.credentials-in-url
    languages: [regex]
    severity: ERROR
    message: >-
      A connection URL embeds a username and password. Move the password to an
      environment variable or secret store and rotate it.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
    pattern-regex: \b(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqps?|mssql|ftp)://[^:/\s"'@$]+:(?!\$\{|\{\{|%\(|<|\*+@|password@|pass@|changeme@)[^@/\s"']{3,}@[^\s"']+
