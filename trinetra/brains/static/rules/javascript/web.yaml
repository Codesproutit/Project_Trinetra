  - id: js-dom-javascript-url-tainted
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The page navigates to a URL taken from the address bar, referrer or a message.
      A value such as "javascript:alert(document.cookie)" runs script in the page,
      and an absolute URL sends the user to another site. Allow only relative paths
      or check that the parsed URL uses http(s) and an allowlisted host.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      security-severity: "6.1"
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/79.html
    mode: taint
    pattern-sources: *dom-sources
    pattern-sanitizers:
      - *safe-url-prefix
      - *allowlist-check
      - *allowlist-check-part
      - *allowlist-check-fn
      # protocol / pattern validation: if (url.protocol !== "https:") return; if (!/^\/[a-z]/.test(p)) ...
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: $CHECKED.$URLPART === $EXPECTED
                      - pattern-inside: $CHECKED.$URLPART !== $EXPECTED
                      - pattern-inside: $ALLOWED.includes($CHECKED.$URLPART)
                      - pattern-inside: $ALLOWED.has($CHECKED.$URLPART)
                  - metavariable-regex:
                      metavariable: $URLPART
                      regex: ^(protocol|origin|host|hostname)$
              - pattern-inside: $RE.test($CHECKED)
          - pattern: $CHECKED
      - pattern-either:
          - pattern: encodeURIComponent(...)
          - pattern: sanitizeUrl(...)
          - pattern: parseInt(...)
          - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: location = $URL
              - pattern: $W.location = $URL
              - pattern: $EL.href = $URL
              - pattern: location.assign($URL)
              - pattern: location.replace($URL)
              - pattern: $W.location.assign($URL)
              - pattern: $W.location.replace($URL)
              - pattern: window.open($URL, ...)
              - pattern: $EL.setAttribute("=~/(?i)^(href|src|action|formaction|xlink:href)$/", $URL)
              - patterns:
                  - pattern-inside: |
                      $ROUTER = useRouter();
                      ...
                  - pattern-either:
                      - pattern: $ROUTER.push($URL, ...)
                      - pattern: $ROUTER.replace($URL, ...)
          - focus-metavariable: $URL

  # ===========================================================================
  # postMessage
  # ===========================================================================
  - id: js-postmessage-missing-origin-check
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This message event handler uses the incoming data without checking
      event.origin. Any window that can reference this page, including a malicious
      site that frames or opens it, can send it messages. Compare event.origin with
      the exact expected origin before trusting event.data.
    metadata:
      cwe: "CWE-346: Origin Validation Error"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      security-severity: "5.4"
      references:
        - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns
        - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html#web-messaging
        - https://cwe.mitre.org/data/definitions/346.html
    patterns:
      - pattern-either:
          - pattern: addEventListener("message", function ($EVT) { ... }, ...)
          - pattern: onmessage = function ($EVT) { ... }
          - patterns:
              - pattern-either:
                  - pattern: $W.addEventListener("message", function ($EVT) { ... }, ...)
                  - pattern: $W.onmessage = function ($EVT) { ... }
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              function $HANDLER($EVT) { ... }
                              ...
                          - pattern-inside: |
                              $HANDLER = function ($EVT) { ... };
                              ...
                      - pattern: $W.addEventListener("message", $HANDLER, ...)
              # window messages only: worker and WebSocket "message" events are not cross-origin
              - metavariable-regex:
                  metavariable: $W
                  regex: ^(window|globalThis|document\.defaultView)$
      - pattern-not: $W.addEventListener("message", function ($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... }, ...)
      - pattern-not: addEventListener("message", function ($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... }, ...)
      - pattern-not: $W.onmessage = function ($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... }
      - pattern-not: onmessage = function ($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... }
      - pattern-not: $W.addEventListener("message", function ({..., origin, ...}) { ... }, ...)
      - pattern-not-inside: |
          function $HANDLER($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... }
          ...
      - pattern-not-inside: |
          $HANDLER = function ($EVT) { ... if (<... $EVT.origin ...>) $GUARD; ... };
          ...
