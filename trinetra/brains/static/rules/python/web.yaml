  - id: py-cors-wildcard-credentials
    languages: [python]
    severity: ERROR
    message: >-
      CORS allows every origin while also allowing credentials, so the library
      reflects any Origin header together with
      Access-Control-Allow-Credentials: true. Any website can then read
      authenticated responses from this API with the victim's cookies. List the
      trusted origins explicitly whenever credentials are allowed.
    metadata:
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [flask-cors, fastapi, starlette, django-cors-headers]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      security-severity: "7.5"
      references:
        - https://portswigger.net/web-security/cors
        - https://flask-cors.readthedocs.io/en/latest/api.html
        - https://www.starlette.io/middleware/#corsmiddleware
        - https://cwe.mitre.org/data/definitions/942.html
    pattern-either:
      # flask-cors: origins defaults to '*'.
      - patterns:
          - pattern-either:
              - pattern: flask_cors.CORS(..., supports_credentials=True, ...)
              - pattern: flask_cors.cross_origin(..., supports_credentials=True, ...)
          - pattern-either:
              - pattern: $CORS(..., origins="=~/^(\*|\.\*|\^\.\*\$?)$/", ...)
              - pattern: $CORS(..., origins=[..., "=~/^(\*|\.\*|\^\.\*\$?)$/", ...], ...)
              - pattern: '$CORS(..., resources={..., $ROUTE: {..., "origins": "*", ...}, ...}, ...)'
              - patterns:
                  - pattern: $CORS(...)
                  - pattern-not: $CORS(..., origins=$ORIGINS, ...)
                  - pattern-not: $CORS(..., resources=$RESOURCES, ...)
      # Starlette / FastAPI CORSMiddleware.
      - patterns:
          - pattern-either:
              - pattern: $APP.add_middleware($MW, ..., allow_credentials=True, ...)
              - pattern: starlette.middleware.Middleware($MW, ..., allow_credentials=True, ...)
          - metavariable-pattern:
              metavariable: $MW
              pattern-either:
                - pattern: starlette.middleware.cors.CORSMiddleware
                - pattern: fastapi.middleware.cors.CORSMiddleware
          - pattern-either:
              - pattern: $CALL(..., allow_origins=[..., "*", ...], ...)
              - pattern: $CALL(..., allow_origins=("*", ...), ...)
              - pattern: $CALL(..., allow_origin_regex="=~/^\^?\.[*+]\$?$/", ...)
      # django-cors-headers.
      - patterns:
          - pattern-either:
              - pattern: CORS_ALLOW_ALL_ORIGINS = True
              - pattern: CORS_ORIGIN_ALLOW_ALL = True
          - pattern-either:
              - pattern-inside: |
                  CORS_ALLOW_CREDENTIALS = True
                  ...
              - pattern-inside: |
                  ...
                  CORS_ALLOW_CREDENTIALS = True
