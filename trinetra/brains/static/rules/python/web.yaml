          - pattern-not: $APP.run(..., host="=~/^(0\.0\.0\.0|::|\[::\])$/", ...)
          - pattern-not: $APP.run("=~/^(0\.0\.0\.0|::|\[::\])$/", ...)
          - pattern-not: $APP.run(..., host=<... os.environ.get($VAR, "0.0.0.0") ...>, ...)
          - pattern-not: $APP.run(..., host=<... os.getenv($VAR, "0.0.0.0") ...>, ...)
          - pattern-not: asyncio.run(...)
      - patterns:
          - pattern-either:
              - pattern: werkzeug.serving.run_simple(..., use_debugger=True, ...)
              - pattern: werkzeug.run_simple(..., use_debugger=True, ...)
          - pattern-not: $RUN("=~/^(0\.0\.0\.0|::|\[::\])$/", ...)
          - pattern-not: $RUN(..., hostname="=~/^(0\.0\.0\.0|::|\[::\])$/", ...)

  - id: py-debug-server-public-bind
    languages: [python]
    severity: ERROR
    message: >-
      A development server is started with the interactive debugger enabled
      and bound to every network interface (0.0.0.0 / ::). Anyone who can
