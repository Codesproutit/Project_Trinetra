                      - pattern: $APP.run("=~/^(0\.0\.0\.0|::|\[::\])$/", ...)
                  - pattern-not: $APP.run(..., debug=False, ...)
      - pattern: werkzeug.serving.run_simple("=~/^(0\.0\.0\.0|::|\[::\])$/", ..., use_debugger=True, ...)
      - pattern: werkzeug.serving.run_simple(..., hostname="=~/^(0\.0\.0\.0|::|\[::\])$/", ..., use_debugger=True, ...)

  - id: py-django-debug-enabled
    languages: [python]
    severity: WARNING
