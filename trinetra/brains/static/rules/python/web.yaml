  - id: py-django-allowed-hosts-wildcard
    languages: [python]
    severity: WARNING
    message: >-
      ALLOWED_HOSTS accepts any Host header ('*'). Django then trusts
      attacker-supplied host names when it builds absolute URLs, which enables
      password-reset link poisoning and web cache poisoning. List the exact
      domain names the site is served on.
    metadata:
      cwe: "CWE-183: Permissive List of Allowed Inputs"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [django]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      security-severity: "5.4"
      references:
        - https://docs.djangoproject.com/en/stable/ref/settings/#allowed-hosts
        - https://docs.djangoproject.com/en/stable/topics/security/#host-header-validation
        - https://cwe.mitre.org/data/definitions/183.html
    patterns:
      - pattern-either:
          - pattern: ALLOWED_HOSTS = [..., "*", ...]
          - pattern: ALLOWED_HOSTS = (..., "*", ...)
          - pattern: 'ALLOWED_HOSTS: $TYPE = [..., "*", ...]'
          - pattern: ALLOWED_HOSTS += [..., "*", ...]
          - pattern: ALLOWED_HOSTS.append("*")
          - pattern: ALLOWED_HOSTS.extend([..., "*", ...])
          - pattern: ALLOWED_HOSTS = <... os.environ.get($VAR, "=~/^\s*\*\s*(,|$)|,\s*\*\s*(,|$)/") ...>
          - pattern: ALLOWED_HOSTS = <... os.getenv($VAR, "=~/^\s*\*\s*(,|$)|,\s*\*\s*(,|$)/") ...>
      - pattern-not-inside: |
          def $FUNC(...):
            ...

  - id: py-cookie-secure-disabled
    languages: [python]
    severity: WARNING
    message: >-
      A session or CSRF cookie is explicitly configured without the Secure
      flag, so browsers also send it over plain HTTP where it can be
      intercepted and replayed. Set SESSION_COOKIE_SECURE and
      CSRF_COOKIE_SECURE (REMEMBER_COOKIE_SECURE for Flask-Login) to True for
      any site served over HTTPS.
    metadata:
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      technology: [django, flask]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      security-severity: "5.0"
      references:
        - https://docs.djangoproject.com/en/stable/ref/settings/#session-cookie-secure
        - https://flask.palletsprojects.com/en/stable/security/#set-cookie-options
        - https://owasp.org/www-community/controls/SecureCookieAttribute
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $SETTING = False
              - pattern: '$SETTING: $TYPE = False'
          - metavariable-regex:
              metavariable: $SETTING
              regex: ^(SESSION_COOKIE_SECURE|CSRF_COOKIE_SECURE|REMEMBER_COOKIE_SECURE|LANGUAGE_COOKIE_SECURE)$
          - pattern-not-inside: |
              def $FUNC(...):
                ...
          - pattern-not-inside: |
              class $CLS(...):
                ...
      # Config classes, unless clearly for development or tests.
      - patterns:
          - pattern-either:
              - pattern: $SETTING = False
              - pattern: '$SETTING: $TYPE = False'
          - metavariable-regex:
              metavariable: $SETTING
              regex: ^(SESSION_COOKIE_SECURE|CSRF_COOKIE_SECURE|REMEMBER_COOKIE_SECURE|LANGUAGE_COOKIE_SECURE)$
          - pattern-inside: |
              class $CLS(...):
                ...
          - pattern-not-inside: |
              def $FUNC(...):
                ...
          - metavariable-regex:
              metavariable: $CLS
              regex: (?i)^(?!.*(dev|test|local|debug)).*$
      - patterns:
          - pattern: $APP.config[$KEY] = False
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'](SESSION_COOKIE_SECURE|REMEMBER_COOKIE_SECURE)["']$
      - pattern: $APP.config.update(..., SESSION_COOKIE_SECURE=False, ...)
      - pattern: $APP.config.update(..., REMEMBER_COOKIE_SECURE=False, ...)

  - id: py-cookie-httponly-disabled
    languages: [python]
