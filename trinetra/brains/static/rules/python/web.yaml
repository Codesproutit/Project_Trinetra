      security-severity: "8.8"
      references:
        - https://werkzeug.palletsprojects.com/en/stable/debug/
        - https://flask.palletsprojects.com/en/stable/deploying/
        - https://cwe.mitre.org/data/definitions/1327.html
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import flask
                  ...
              - pattern-inside: |
                  from flask import $NAME
                  ...
          - pattern-either:
              - pattern: $APP.run(..., host="=~/^(0\.0\.0\.0|::|\[::\])$/", ..., debug=True, ...)
              - pattern: $APP.run("=~/^(0\.0\.0\.0|::|\[::\])$/", ..., debug=True, ...)
              - pattern: $APP.run(..., host=<... os.environ.get($VAR, "0.0.0.0") ...>, ..., debug=True, ...)
              - pattern: $APP.run(..., host=<... os.getenv($VAR, "0.0.0.0") ...>, ..., debug=True, ...)
