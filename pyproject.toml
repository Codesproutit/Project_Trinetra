[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trinetra"
version = "0.1.0"
description = "Deterministic-first, AI-augmented, self-evolving application security testing platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Codesproutit" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The Anthropic adapter is the first concrete provider; others plug in behind the same interface.
llm = ["anthropic>=0.40"]
# The local control panel (optional): FastAPI serves the browser UI.
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
trinetra = "trinetra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["trinetra"]
# Ship the control panel's static page and the bundled rulesets (non-.py files).
artifacts = ["trinetra/dashboard/static/*", "trinetra/rules/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Rule fixtures are deliberately vulnerable code for `semgrep --test`, not project code.
extend-exclude = ["tests/rule_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
